name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myapp
          POSTGRES_USER: myapp_user
          POSTGRES_PASSWORD: myapp_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myapp_user -d myapp"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            frontend/package-lock.json
      - run: npm run install:all
      - run: npm run check
      - run: npm --prefix api run test:learner
      - name: Exercise the compiled HTTP server
        run: |
          node api/dist/server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 \
            http://localhost:3000/debug/routes --output /dev/null
          npm --prefix api run test:routes
